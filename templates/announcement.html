{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-megaphone-fill me-2"></i>Manage Announcement
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="announcement" class="form-label">Announcement Text</label>
                            <textarea class="form-control" id="announcement" name="announcement" rows="4" placeholder="Enter announcement text...">{{ announcement }}</textarea>
                        </div>
                        <div class="text-end">
                            <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Announcement</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
