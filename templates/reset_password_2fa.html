{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-check text-success" style="font-size: 3rem;"></i>
                <h3 class="mt-3 mb-2">Verify Identity</h3>
                <p class="text-muted mb-4">Please enter the code from your Google Authenticator app.</p>

                <form method="POST">
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control text-center fs-3 letter-spacing-2" id="otp" name="otp"
                            placeholder="000000" maxlength="6" required autocomplete="off">
                        <label for="otp">6-Digit Code</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Verify & Reset</button>
                        <a href="{{ url_for('login_page') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .letter-spacing-2 {
        letter-spacing: 0.5rem;
    }
</style>
{% endblock %}
