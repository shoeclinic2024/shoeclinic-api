<!DOCTYPE html>
<html lang="en">
<head>
  <title>Send WhatsApp - THE SHOE CLINIC</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .confirmation-box {
      max-width: 480px;
      padding: 2rem;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }
    .brand-title {
      color: #0d6efd;
      font-weight: bold;
      font-size: 1.5rem;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
  <div class="confirmation-box text-center">
    <div class="brand-title mb-3">THE SHOE CLINIC</div>
    <h5 class="text-success">✅ Order for <strong>{{ name }}</strong> added successfully!</h5>
    <p class="text-muted">Click below to send pickup confirmation via WhatsApp.</p>

    <a href="{{ whatsapp_url }}" target="_blank" class="btn btn-success w-100 my-2">📲 Send WhatsApp Message</a>
    <a href="/dashboard" class="btn btn-outline-secondary w-100">← Back to Dashboard</a>
  </div>
</body>
</html>
