{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-3 mb-2">Forgot Password?</h3>
                <p class="text-muted mb-4">Enter your username to begin the recovery process.</p>

                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username"
                            required>
                        <label for="username">Username</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Next</button>
                        <a href="{{ url_for('login_page') }}" class="btn btn-outline-secondary">Back to Login</a>
                    </div>
                </form>

                <div class="mt-4 text-start small text-muted bg-light p-3 rounded">
                    <i class="bi bi-info-circle me-1"></i>
                    <strong>Note:</strong> You can only reset your password yourself if you have <strong>Two-Factor
                        Authentication (2FA)</strong> enabled. Otherwise, please contact your administrator.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
