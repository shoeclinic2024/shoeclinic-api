<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shoe Clinic - Auth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      color: #fff;
    }

    .auth-card h2 {
      font-weight: 600;
      text-align: center;
      margin-bottom: 5px;
    }

    .auth-card p {
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
      opacity: 0.85;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      border: 1px solid #00c6ff;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      color: #fff;
      font-weight: 600;
      transition: transform 0.2s ease-in-out;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 114, 255, 0.4);
    }

    .nav-tabs {
      border-bottom: none;
      justify-content: center;
      margin-bottom: 20px;
    }

    .nav-tabs .nav-link {
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 500;
    }

    .nav-tabs .nav-link.active {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
    }

    .alert {
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <h2>THE SHOE CLINIC</h2>
    <p>Login or Register</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <!-- Tabs -->
    <ul class="nav nav-tabs" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button"
          role="tab">Login</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button"
          role="tab">Register</button>
      </li>
    </ul>

    <!-- Tab Contents -->
    <div class="tab-content mt-3">
      <!-- Login -->
      <div class="tab-pane fade show active" id="login" role="tabpanel">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
          </div>
          <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
          </div>
          <button type="submit" class="btn-gradient">Login</button>
          <div class="text-center mt-3">
            <a href="{{ url_for('forgot_password') }}"
              style="color: #fff; text-decoration: none; font-size: 13px;">Forgot Password?</a>
          </div>
        </form>
      </div>

      <!-- Register -->
      <div class="tab-pane fade" id="register" role="tabpanel">
        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Choose Username" required>
          </div>
          <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Choose Password" required>
          </div>

          <!-- Role Selection -->
          <div class="mb-3">
            <label for="role" class="form-label">Select Role</label>
            <select name="role" id="role" class="form-control" required>
              <option value="employee" selected>Technician</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <button type="submit" class="btn-gradient">Register</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Auto-dismiss alerts after 2 seconds
      const alerts = document.querySelectorAll('.alert-dismissible');
      alerts.forEach(function (alert) {
        setTimeout(function () {
          let bsAlert = new bootstrap.Alert(alert);
          bsAlert.close();
        }, 2000); // 2 seconds
      });
    });
  </script>
</body>

</html>
