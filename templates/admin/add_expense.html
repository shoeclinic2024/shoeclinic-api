{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-transparent py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-wallet2 me-2"></i>Add New Expense</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.add_expense') }}">
                    <!-- Title -->
                    <div class="mb-3">
                        <label class="form-label">Expense Title</label>
                        <div class="input-group">
                            <input type="text" name="title" id="expenseTitle" class="form-control"
                                placeholder="e.g. Office Rent, Technician Name" list="staffList" required>
                            <button class="btn btn-outline-primary d-none" type="button" id="btnFetchSalary"
                                onclick="fetchSalary()">
                                <i class="bi bi-calculator me-1"></i> Fetch Salary
                            </button>
                        </div>
                        <datalist id="staffList">
                            {% for s in staff_members %}
                            <option value="{{ s.name }}">
                                {% endfor %}
                        </datalist>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label text-primary fw-bold">Actual Value (₹)</label>
                            <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00"
                                id="actualValue" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-success fw-bold">Approved Value (₹)</label>
                            <input type="number" step="0.01" name="real_amount" class="form-control" placeholder="0.00"
                                id="realValue">
                            <small class="text-muted" style="font-size: 0.75rem;">Leave empty if same as Actual</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category</label>
                            <select name="category" id="expenseCategory" class="form-select" required
                                onchange="toggleSalaryButton()">
                                <option value="" selected disabled>Select Category</option>
                                <option value="Rent">Rent</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Salary">Salary</option>
                                <option value="Salary Advance">Salary Advance</option>
                                <option value="Supplies">Supplies</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Petrol">Petrol</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Electricity">Electricity</option>
                            </select>
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="expense_date" class="form-control" value="{{ today_date }}" required>
                    </div>

                    <!-- Description -->
                    <div class="mb-4">
                        <label class="form-label">Description (Optional)</label>
                        <textarea name="description" id="expenseDesc" class="form-control" rows="3"
                            placeholder="Additional details..."></textarea>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('home') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i> Save Expense
                        </button>
                    </div>
                </form>

                <script>
                    const staffNames = {{ staff_members| map(attribute = 'name') | list | tojson | safe }};

                    function toggleSalaryButton() {
                        const cat = document.getElementById('expenseCategory').value;
                        const btn = document.getElementById('btnFetchSalary');
                        if (cat === 'Salary' || cat === 'Salary Advance') {
                            btn.classList.remove('d-none');
                        } else {
                            btn.classList.add('d-none');
                        }
                    }

                    async function fetchSalary() {
                        const name = document.getElementById('expenseTitle').value.trim();
                        if (!name) {
                            alert("Please enter a staff name first.");
                            return;
                        }

                        const btn = document.getElementById('btnFetchSalary');
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Calculating...';
                        btn.disabled = true;

                        try {
                            const response = await fetch(`/admin/get_staff_balance/${encodeURIComponent(name)}`);
                            const data = await response.json();

                            if (data.error) {
                                alert(data.error);
                            } else {
                                document.getElementById('actualValue').value = data.balance.toFixed(2);
                                document.getElementById('realValue').value = data.balance.toFixed(2);
                                document.getElementById('expenseDesc').value = `Outstanding payment as of ${new Date().toLocaleDateString()}. (Total Earned: ₹${data.earned.toFixed(2)}, Already Paid: ₹${data.paid.toFixed(2)})`;
                            }
                        } catch (error) {
                            console.error('Error fetching balance:', error);
                            alert("Could not calculate salary. Please try again.");
                        } finally {
                            btn.innerHTML = originalText;
                            btn.disabled = false;
                        }
                    }
                </script>
            </div>
        </div>
    </div>
</div>
{% endblock %}
